name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: devpassword
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
      kafka:
        image: apache/kafka:3.9.0
        ports: ["59092:59092"]
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:59092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: INTERNAL://localhost:9092,EXTERNAL://localhost:59092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install pinned tools
        run: make tools

      - name: Generated code is up to date
        run: |
          make proto
          git diff --exit-code -- gen

      - name: Protobuf contracts are backward compatible
        if: github.event_name == 'pull_request'
        run: .tools/bin/buf breaking --against ".git#branch=origin/${{ github.base_ref }}"

      - name: Format, vet, staticcheck, buf lint
        run: make lint

      - name: Known vulnerabilities
        run: make vuln

      - name: Create database roles
        env:
          PGPASSWORD: devpassword
        run: psql -h localhost -p 55432 -U postgres -v ON_ERROR_STOP=1 -f deploy/postgres-init.sql

      - name: Tests (race detector; integration tests may not skip)
        run: make test
