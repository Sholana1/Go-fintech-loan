# Local scrape configuration (`docker compose --profile obs up prometheus`).
# Services run on the host; their admin ports expose /metrics.
global:
  scrape_interval: 10s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: ledger
    static_configs: [{targets: ["host.docker.internal:7101"]}]
  - job_name: identity
    static_configs: [{targets: ["host.docker.internal:7102"]}]
  - job_name: lending
    static_configs: [{targets: ["host.docker.internal:7103"]}]
